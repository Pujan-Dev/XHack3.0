<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .register-container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        h1 {
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #4CAF50;
            border: none;
            border-radius: 4px;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            font-size: 14px;
        }
        .success {
            color: green;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="register-container">
        <h1>Register</h1>
        <form id="registerForm">
            <div class="form-group">
                <input type="text" id="username" name="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            <div class="form-group">
                <input type="email" id="email" name="email" placeholder="Email" required>
            </div>
            <button type="submit">Register</button>
        </form>
        <p id="registerResult"></p>
        <a href="/">Back to Home</a>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const email = document.getElementById('email').value;

            // Basic Validation
            if (!/^[A-Za-z0-9]+$/.test(username)) {
                alert('Username must contain only letters and numbers.');
                return;
            }
            if (!/^[^@]+@[^@]+\.[^@]+$/.test(email)) {
                alert('Please provide a valid email address.');
                return;
            }

            // Create the data object to send
            const data = { username, password, email };

            // Send the data to Flask backend using Fetch API
            fetch('/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to register');
                }
                return response.json();
            })
            .then(data => {
                const resultElement = document.getElementById('registerResult');
                if (data.message) {
                    resultElement.innerText = data.message;
                    resultElement.className = data.message.includes('successfully') ? 'success' : 'error';
                    if (data.message.includes('successfully')) {
                        document.getElementById('registerForm').reset();
                    }
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('registerResult').innerText = 'Registration failed. Please try again.';
            });
        });
    </script>

</body>
</html>
