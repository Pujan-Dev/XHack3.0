<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pujan's Prediction</title>
</head>
<body>
    <h1>Pujan's Prediction</h1>
    <input type="file" id="pujanFile">
    <button onclick="predictPujan()">Predict</button>
    <p id="pujanResult"></p>
    <a href="/">Back to Home</a>

    <script>
        function predictPujan() {
            const file = document.getElementById('pujanFile').files[0];
            if (!file) {
                alert('Please select a file');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Image = e.target.result.split(',')[1];
                fetch('/api/predict_pujan', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ image: `data:image/jpeg;base64,${base64Image}` })
                })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('pujanResult').innerText = `Predicted Class: ${data.predicted_class}, Confidence: ${data.confidence}`;
                })
                .catch(error => console.error('Error:', error));
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
