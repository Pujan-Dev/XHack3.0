<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sujal's Prediction</title>
</head>
<body>
    <h1>Sujal's Prediction</h1>
    <form id="sujalForm" enctype="multipart/form-data">
        <input type="file" name="file" id="sujalFile">
        <button type="submit">Predict</button>
    </form>
    <p id="sujalResult"></p>
    <a href="/">Back to Home</a>

    <script>
        document.getElementById('sujalForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('file', document.getElementById('sujalFile').files[0]);

            fetch('/api/predict_sujal', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('sujalResult').innerText = `Predicted Class: ${data.predicted_class}, Confidence: ${data.confidence}`;
            })
            .catch(error => console.error('Error:', error));
        });
    </script>
</body>
</html>
