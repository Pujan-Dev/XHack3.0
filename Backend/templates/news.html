<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News</title>
</head>
<body>
    <h1>News</h1>
    <button onclick="fetchNews()">Fetch News</button>
    <div id="newsResult"></div>
    <a href="/">Back to Home</a>

    <script>
        function fetchNews() {
            fetch('/api/news')
            .then(response => response.json())
            .then(data => {
                const newsResult = document.getElementById('newsResult');
                newsResult.innerHTML = '';
                data.forEach(article => {
                    const articleDiv = document.createElement('div');
                    articleDiv.innerHTML = `<h3>${article.title}</h3><p>${article.content}</p><p>Country: ${article.country}</p>`;
                    newsResult.appendChild(articleDiv);
                });
            })
            .catch(error => console.error('Error:', error));
        }
    </script>
</body>
</html>
